[package]
name = "embassy-nrf-esb"
version = "0.1.0"
edition = "2024"
description = "Pure Rust ESB (Enhanced ShockBurst) implementation for nRF52, built on Embassy async"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Raymond8196/embassy-nrf-esb"
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
keywords = ["nrf52", "esb", "radio", "embassy", "async"]

[dependencies]
embassy-nrf = { version = "0.10", features = ["unstable-pac"] }
embassy-sync = "0.8"
cortex-m = { version = "0.7", default-features = false }
defmt = { version = "0.3", optional = true }

[features]
# Chip selection (only nrf52840 implemented initially, others reserved)
nrf52840 = ["embassy-nrf/nrf52840"]
nrf52833 = ["embassy-nrf/nrf52833"]
nrf52832 = ["embassy-nrf/nrf52832"]
# Board selection (memory layout for bootloader)
board-dongle = []
board-nicenano = []
# Functional options
fast-ru = []
defmt = ["dep:defmt", "embassy-nrf/defmt"]

[dev-dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.10", features = ["nrf52840", "unstable-pac", "time", "time-driver-rtc1"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-usb = "0.6"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[[example]]
name = "ptx_basic"
required-features = ["nrf52840", "defmt"]

[[example]]
name = "prx_basic"
required-features = ["nrf52840", "defmt"]

[[example]]
name = "prx_usb"
required-features = ["nrf52840"]

[[example]]
name = "ptx_silent"
required-features = ["nrf52840"]
