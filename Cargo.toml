[package]
name = "embassy-nrf-esb"
version = "0.1.0"
edition = "2024"
description = "Pure Rust ESB (Enhanced ShockBurst) implementation for nRF52, built on Embassy async"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Raymond8196/embassy-nrf-esb"
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
keywords = ["nrf52", "esb", "radio", "embassy", "async"]

[dependencies]
embassy-nrf = { version = "0.10", features = ["unstable-pac"] }
embassy-sync = "0.8"
cortex-m = { version = "0.7", default-features = false }
defmt = { version = "0.3", optional = true }
# nrf-mpsl: tracked via git because crates.io 0.3.0 still pins embassy-nrf 0.7,
# while this crate uses 0.10. The git head migrated nrf-mpsl to embassy-nrf 0.10.
# Pin to a known-good SHA for reproducibility.
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "08620f00fa54e1423c4d54d2da073fb819602d27", optional = true, default-features = false }

[features]
# Chip selection (only nrf52840 implemented initially, others reserved)
nrf52840 = ["embassy-nrf/nrf52840", "nrf-mpsl?/nrf52840"]
nrf52833 = ["embassy-nrf/nrf52833", "nrf-mpsl?/nrf52833"]
nrf52832 = ["embassy-nrf/nrf52832", "nrf-mpsl?/nrf52832"]
# Board selection (memory layout for bootloader)
board-dongle = []
board-nicenano = []
# Functional options
fast-ru = []
defmt = ["dep:defmt", "embassy-nrf/defmt", "nrf-mpsl?/defmt"]
# MPSL timeslot integration (M10) — gated; off by default.
# Brings nrf-mpsl's critical-section impl; mutually exclusive with `_cs-cortex`.
mpsl = ["dep:nrf-mpsl", "nrf-mpsl/critical-section-impl"]
# Internal: enables cortex-m's critical-section-single-core impl for examples
# that do NOT use mpsl. Library code does not depend on this; required by the
# M9 example binaries (ptx_basic, prx_basic, etc.) so they link a cs provider.
# Mutually exclusive with `mpsl`.
_cs-cortex = ["cortex-m/critical-section-single-core"]

[target.'cfg(target_arch = "arm")'.dev-dependencies]
bt-hci = { version = "0.8", default-features = false }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.10", features = ["nrf52840", "unstable-pac", "time", "time-driver-rtc1"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-usb = "0.6"
cortex-m = { version = "0.7", default-features = false }
cortex-m-rt = "0.7"
defmt-rtt = "1"
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "08620f00fa54e1423c4d54d2da073fb819602d27", features = ["nrf52840", "peripheral", "defmt"], default-features = false }
panic-probe = { version = "1", features = ["print-defmt"] }
panic-halt = "1"
static_cell = "2"
postcard = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
heapless = { version = "0.8", default-features = false }
usbd-hid = "0.8"

[[example]]
name = "ptx_basic"
required-features = ["nrf52840", "defmt", "_cs-cortex"]

[[example]]
