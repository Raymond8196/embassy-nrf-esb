[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA"
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

# `cargo xtask ...` runs the host-only task helper. The root `build.target`
# below cross-compiles to thumbv7em, so xtask must be built for the host
# explicitly. Adjust the triple if you develop on a non-macOS-ARM host.
[alias]
xtask = "run --package xtask --target aarch64-apple-darwin --"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "trace"
